apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "dbtether.fullname" . }}-manager-role
  labels:
    {{- include "dbtether.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - dbtether.io
    resources:
      - dbclusters
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - dbtether.io
    resources:
      - dbclusters/status
    verbs:
      - patch
  - apiGroups:
      - dbtether.io
    resources:
      - databases
    verbs:
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - dbtether.io
    resources:
      - databases/status
    verbs:
      - patch
  - apiGroups:
      - dbtether.io
    resources:
      - databaseusers
    verbs:
      - get
      - list
      - patch
      - watch
  - apiGroups:
      - dbtether.io
    resources:
      - databaseusers/status
    verbs:
      - patch
  - apiGroups:
      - dbtether.io
    resources:
      - databaseusers/finalizers
    verbs:
      - update
  - apiGroups:
      - dbtether.io
    resources:
      - backupstorages
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - dbtether.io
    resources:
      - backupstorages/status
    verbs:
      - patch
  - apiGroups:
      - dbtether.io
    resources:
      - backups
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - dbtether.io
    resources:
      - backups/status
    verbs:
      - patch
  - apiGroups:
      - dbtether.io
    resources:
      - backupschedules
    verbs:
      - get
      - list
      - patch
      - watch
  - apiGroups:
      - dbtether.io
    resources:
      - backupschedules/status
    verbs:
      - patch
  - apiGroups:
      - dbtether.io
    resources:
      - backupschedules/finalizers
    verbs:
      - update
  - apiGroups:
      - dbtether.io
    resources:
      - restores
    verbs:
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - dbtether.io
    resources:
      - restores/status
    verbs:
      - patch
  - apiGroups:
      - batch
    resources:
      - jobs
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - watch
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - create
      - delete
      - get
      - list
      - update
      - watch
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - create
      - get
      - update
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - list
      - watch
