---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: restores.dbtether.io
spec:
  group: dbtether.io
  names:
    kind: Restore
    listKind: RestoreList
    plural: restores
    shortNames:
    - rst
    singular: restore
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.target.databaseRef.name
      name: Target
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.duration
      name: Duration
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Restore is the Schema for the restores API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: RestoreSpec defines the desired state of Restore
            properties:
              onConflict:
                default: fail
                description: |-
                  How to handle conflicts with existing data
                  - fail: Abort if database is not empty (default)
                  - drop: Drop and recreate the database before restore
                enum:
                - fail
                - drop
                type: string
              source:
                description: Source of the backup to restore from
                properties:
                  backupRef:
                    description: Reference to an existing Backup resource
                    properties:
                      name:
                        type: string
                      namespace:
                        description: Namespace of the Backup (defaults to same namespace
                          as Restore)
                        type: string
                    required:
                    - name
                    type: object
                  latestFrom:
                    description: LatestFrom automatically finds the latest successful
                      backup for a database
                    properties:
                      databaseRef:
                        description: Reference to the Database to find the latest
                          backup for; its namespace defaults to namespace below
                        properties:
                          name:
                            type: string
                          namespace:
                            description: Namespace of the Database. A namespace other
                              than the referencing resource's must be listed in the
                              Database's spec.allowedNamespaces.
                            type: string
                        required:
                        - name
                        type: object
                      namespace:
                        description: Namespace to search for backups (defaults to
                          same namespace as Restore)
                        type: string
                    required:
                    - databaseRef
                    type: object
                  path:
                    description: |-
                      Direct path to backup file in storage (e.g., "cluster/database/20260120-140000.sql.gz")
                      Requires storageRef to be set
                    type: string
                  storageRef:
                    description: Reference to BackupStorage (required when using path)
                    properties:
                      name:
                        type: string
                    required:
                    - name
                    type: object
                type: object
                x-kubernetes-validations:
                - message: set exactly one of backupRef, latestFrom, path
                  rule: '(has(self.backupRef) ? 1 : 0) + (has(self.latestFrom) ? 1
                    : 0) + (has(self.path) ? 1 : 0) == 1'
              target:
                description: Target database to restore into
                properties:
                  databaseRef:
                    description: Reference to the Database to restore into
                    properties:
                      name:
                        type: string
                      namespace:
                        description: Namespace of the Database. A namespace other
                          than the referencing resource's must be listed in the Database's
                          spec.allowedNamespaces.
                        type: string
                    required:
                    - name
                    type: object
                required:
                - databaseRef
                type: object
                x-kubernetes-validations:
                - message: target database must be in the Restore's namespace
                  rule: '!has(self.databaseRef.__namespace__) || self.databaseRef.__namespace__
                    == '''''
              ttlAfterCompletion:
                description: TTL of the Kubernetes Job after it finishes. Defaults
                  to 1 hour
                type: string
            required:
            - source
            - target
            type: object
            x-kubernetes-validations:
            - message: spec is immutable; create a new Restore
              rule: self == oldSelf
          status:
            description: RestoreStatus defines the observed state of Restore
            properties:
              completedAt:
                format: date-time
                type: string
              duration:
                description: Duration of the restore operation
                type: string
              grantAttempts:
                description: Number of failed grant re-apply rounds so far.
                format: int32
                type: integer
              jobName:
                description: Name of the Job created for this restore
                type: string
              jobSucceededAt:
                description: Time the restore Job reported that the backup was restored
                  into the target database.
                format: date-time
                type: string
              message:
                description: Human-readable message about the current status
                type: string
              observedGeneration:
                format: int64
                type: integer
              phase:
                description: |-
                  Current phase of the restore operation.
                  Granting means the data is restored but the target's DatabaseUsers do not hold their grants yet.
                enum:
                - Pending
                - Running
                - Granting
                - Completed
                - Failed
                type: string
              runId:
                description: RunID is a unique identifier for this restore run
                type: string
              sourcePath:
                description: Path of the backup file being restored
                type: string
              specHash:
                description: Hash of spec to prevent accidental re-runs
                type: string
              startedAt:
                format: date-time
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
