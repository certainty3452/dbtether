apiVersion: v2
name: dbtether
description: A Kubernetes operator for managing PostgreSQL databases in external clusters
type: application
version: 0.9.0
appVersion: "0.9.0"
home: https://github.com/certainty3452/dbtether
# icon: https://raw.githubusercontent.com/certainty3452/dbtether/main/docs/logo.png
keywords:
  - postgresql
  - postgres
  - database
  - operator
  - kubernetes
  - aurora
  - rds
  - backup
  - restore
  - dbtether
maintainers:
  - name: certainty3452
    url: https://github.com/certainty3452
sources:
  - https://github.com/certainty3452/dbtether
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/operator: "true"
  artifacthub.io/operatorCapabilities: Full Lifecycle
  artifacthub.io/category: database
  artifacthub.io/crds: |
    - kind: DBCluster
      version: v1alpha1
      name: dbclusters.dbtether.io
      displayName: Database Cluster
      description: Connection to external PostgreSQL cluster (RDS, Aurora, etc.)
    - kind: Database
      version: v1alpha1
      name: databases.dbtether.io
      displayName: Database
      description: PostgreSQL database managed by the operator
    - kind: DatabaseUser
      version: v1alpha1
      name: databaseusers.dbtether.io
      displayName: Database User
      description: PostgreSQL user with automatic password rotation
    - kind: BackupStorage
      version: v1alpha1
      name: backupstorages.dbtether.io
      displayName: Backup Storage
      description: S3/GCS/Azure storage configuration for backups
    - kind: Backup
      version: v1alpha1
      name: backups.dbtether.io
      displayName: Backup
      description: One-time database backup
    - kind: BackupSchedule
      version: v1alpha1
      name: backupschedules.dbtether.io
      displayName: Backup Schedule
      description: Scheduled database backups with retention policy
    - kind: Restore
      version: v1alpha1
      name: restores.dbtether.io
      displayName: Restore
      description: Restore database from backup
  artifacthub.io/links: |
    - name: Documentation
      url: https://github.com/certainty3452/dbtether#readme
    - name: Source
      url: https://github.com/certainty3452/dbtether
  artifacthub.io/crdsExamples: |
    - apiVersion: dbtether.io/v1alpha1
      kind: DBCluster
      metadata:
        name: microservices
      spec:
        endpoint: microservices-prod.cluster-xxxxxxxxxxxx.eu-central-1.rds.amazonaws.com
        port: 5432
        credentialsSecretRef:
          name: microservices-credentials
          namespace: dbtether
    - apiVersion: dbtether.io/v1alpha1
      kind: Database
      metadata:
        name: orders-db
        namespace: team-alpha
      spec:
        clusterRef:
          name: microservices
        extensions:
          - uuid-ossp
          - pg_trgm
        deletionPolicy: Delete
    - apiVersion: dbtether.io/v1alpha1
      kind: DatabaseUser
      metadata:
        name: orders-api
        namespace: team-alpha
      spec:
        database:
          name: orders-db
        privileges: readwrite
        password:
          length: 32
        rotation:
          days: 30
        idleInTransactionTimeout: 5m
        secret:
          template: POSTGRES
    - apiVersion: dbtether.io/v1alpha1
      kind: BackupStorage
      metadata:
        name: company-s3
      spec:
        s3:
          bucket: my-company-backups
          region: eu-central-1
        pathTemplate: "{{ .ClusterName }}/{{ .Year }}/{{ .Month }}"
    - apiVersion: dbtether.io/v1alpha1
      kind: Backup
      metadata:
        name: orders-backup-20260119
        namespace: team-alpha
      spec:
        databaseRef:
          name: orders-db
        storageRef:
          name: company-s3
        ttlAfterCompletion: 1h
        trigger: "v1.2.3"
    - apiVersion: dbtether.io/v1alpha1
      kind: BackupSchedule
      metadata:
        name: orders-nightly
        namespace: orders-team
      spec:
        databaseRef:
          name: orders-db
        storageRef:
          name: company-s3
        schedule: "0 2 * * *"
        retention:
          keepLast: 7
          keepDaily: 30
          keepWeekly: 12
          keepMonthly: 12
    - apiVersion: dbtether.io/v1alpha1
      kind: Restore
      metadata:
        name: restore-orders-latest
        namespace: default
      spec:
        source:
          latestFrom:
            databaseRef:
              name: orders-db
        target:
          databaseRef:
            name: orders-db-restored
        onConflict: drop
  artifacthub.io/changes: |
    - kind: changed
      description: "Breaking: Restore no longer offers `onConflict: overwrite`. Use `drop` to replace the database or `fail` to refuse when it is not empty."
    - kind: changed
      description: "Breaking: A DatabaseUser must list each database once and use either `database` or `databases`, not both. With per-database secrets (`secretGeneration: perDatabase`) the database names must be unique."
    - kind: fixed
      description: "A restore that ran into an error used to report success and leave the database half restored. It now restores everything or nothing and reports the error."
    - kind: fixed
      description: "Restoring into RDS failed on extension comments in the dump. They are skipped now."
    - kind: fixed
      description: "Empty or unsupported backup files are refused before the target database is touched."
    - kind: fixed
      description: "Backup Jobs ignored the configured SSL mode."
    - kind: fixed
      description: "A failed backup now reports what went wrong instead of a generic \"retries exhausted\"."
    - kind: changed
      description: "Only one DatabaseUser can own a database. When two claim it, the older one keeps ownership and the other is reported as failed."
    - kind: changed
      description: "Backup and restore Jobs use the PostgreSQL client that matches the database server version; clients 16, 17 and 18 ship in the image."
