# Default values for dbtether

replicaCount: 1
# Number of old ReplicaSets to retain (Kubernetes default is 10)
revisionHistoryLimit: ""

image:
  repository: ghcr.io/certainty3452/dbtether
  pullPolicy: IfNotPresent
  # Automatically updated by release pipeline from git tag
  tag: "0.5.8"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

# Additional annotations for the operator pod
podAnnotations: {}

# Additional labels for the operator pod (in addition to standard app.kubernetes.io/* labels)
podLabels: {}
# Example:
#   custom-label: my-value

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}

# Leader election configuration
leaderElection:
  enabled: true

# Metrics configuration
metrics:
  enabled: true
  port: 8080

# Health probe configuration
health:
  port: 8081

# Probes configuration
# Startup probe - gives time for leader election and initialization
# failureThreshold * periodSeconds = max startup time (default: 30 * 10 = 300s = 5 min)
startupProbe:
  httpGet:
    path: /healthz
    port: health
  periodSeconds: 10
  timeoutSeconds: 1
  successThreshold: 1
  failureThreshold: 30

livenessProbe:
  httpGet:
    path: /healthz
    port: health
  initialDelaySeconds: 15
  periodSeconds: 20
  timeoutSeconds: 1
  successThreshold: 1
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /readyz
    port: health
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 1
  successThreshold: 1
  failureThreshold: 3

# Logging configuration
logging:
  level: info  # debug, info, warn, error
  format: json  # json, console

# Backup configuration
backup:
  # Maximum concurrent backup jobs per DBCluster (prevents connection pool exhaustion)
  maxConcurrentPerCluster: 3

  # Resources for backup job pods
  # Important: pg_dump buffers entire database in memory before upload
  # Set memory limit based on your largest database size
  resources:
    limits:
      memory: 2Gi
    requests:
      cpu: 100m
      memory: 512Mi

  # Annotations for backup job pods
  # Use this to protect backup pods from autoscaler disruption (Karpenter, cluster-autoscaler)
  # Similar to Dagster's runK8sConfig.podTemplateSpecMetadata.annotations
  # or Airbyte's global.jobs.kube.annotations
  podAnnotations: {}
  # Example:
  #   karpenter.sh/do-not-disrupt: "true"
  #   cluster-autoscaler.kubernetes.io/safe-to-evict: "false"

  # Labels for backup job pods (in addition to required dbtether.io/* labels)
  # Use for log filtering in Grafana/Loki, monitoring, etc.
  podLabels: {}
  # Example:
  #   app.kubernetes.io/name: dbtether-backup
  #   app.kubernetes.io/component: backup-job

  # Labels for backup Job objects (in addition to required dbtether.io/* labels)
  jobLabels: {}
  # Example:
  #   app.kubernetes.io/name: dbtether-backup
  #   app.kubernetes.io/managed-by: dbtether

# Extra environment variables for the operator pod
# Use this for credentialsFromEnv in DBCluster resources
extraEnv: []
# Example:
#   - name: AURORA_USERNAME
#     valueFrom:
#       secretKeyRef:
#         name: aurora-credentials
#         key: username
#   - name: AURORA_PASSWORD
#     valueFrom:
#       secretKeyRef:
#         name: aurora-credentials
#         key: password
