apiVersion: dbtether.io/v1alpha1
kind: DBCluster
metadata:
  name: microservices
spec:
  endpoint: microservices-prod.cluster-xxxxxxxxxxxx.eu-central-1.rds.amazonaws.com
  port: 5432
  credentialsSecretRef:
    name: microservices-credentials
    namespace: dbtether
---
apiVersion: dbtether.io/v1alpha1
kind: DBCluster
metadata:
  name: platform
spec:
  endpoint: postgres-primary.internal.company.local
  port: 5432
  # Values are env var names read from the operator pod
  credentialsFromEnv:
    username: PLATFORM_DB_USERNAME
    password: PLATFORM_DB_PASSWORD
