    name: orders-db
  storageRef:
    name: company-s3
  filenameTemplate: "{{ .DatabaseName }}_{{ .RunID }}.sql.gz"
  ttlAfterCompletion: 168h
---
apiVersion: dbtether.io/v1alpha1
kind: Backup
metadata:
  name: large-db-backup
  namespace: team-alpha
spec:
  databaseRef:
    name: large-db
  storageRef:
    name: company-s3
  jobConfig:
    backoffLimit: 5
    activeDeadlineSeconds: 7200
    ttlSecondsAfterFailed: 86400
