apiVersion: dbtether.io/v1alpha1
kind: Backup
metadata:
  name: orders-backup-20260119
  namespace: team-alpha
spec:
  databaseRef:
    name: orders-db
  storageRef:
    name: company-s3
---
apiVersion: dbtether.io/v1alpha1
kind: Backup
metadata:
  name: orders-backup-keep-longer
  namespace: team-alpha
spec:
