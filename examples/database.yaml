apiVersion: dbtether.io/v1alpha1
kind: Database
metadata:
  name: orders-db  # becomes orders_db in PostgreSQL
  namespace: team-alpha
spec:
  clusterRef:
    name: microservices
  extensions:
    - uuid-ossp
    - pg_trgm
  deletionPolicy: Delete
---
apiVersion: dbtether.io/v1alpha1
kind: Database
metadata:
  name: payments-db
  namespace: team-alpha
spec:
  clusterRef:
    name: microservices
  extensions:
    - uuid-ossp
  deletionPolicy: Retain
  revokePublicConnect: true
---
apiVersion: dbtether.io/v1alpha1
kind: Database
metadata:
  name: backstage
  namespace: platform
spec:
  clusterRef:
    name: platform
  databaseName: backstage_production
  deletionPolicy: Retain
---
apiVersion: dbtether.io/v1alpha1
kind: Database
metadata:
  name: legacy-app-db
  namespace: migrations
spec:
  clusterRef:
    name: microservices
  databaseName: legacy_application
  deletionPolicy: Retain
