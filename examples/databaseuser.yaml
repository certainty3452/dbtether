apiVersion: dbtether.io/v1alpha1
kind: DatabaseUser
metadata:
  name: orders-api
  namespace: team-alpha
spec:
  database:
    name: orders-db
  privileges: readwrite
---
apiVersion: dbtether.io/v1alpha1
kind: DatabaseUser
metadata:
  name: orders-migrations
  namespace: team-alpha
spec:
  database:
    name: orders-db
  username: orders_admin
  privileges: admin
  password:
    length: 32
  rotation:
    days: 30
  deletionPolicy: Delete
---
apiVersion: dbtether.io/v1alpha1
kind: DatabaseUser
metadata:
  name: orders-readonly
  namespace: team-alpha
spec:
  database:
    name: orders-db
  privileges: readonly
  connectionLimit: 5
---
apiVersion: dbtether.io/v1alpha1
kind: DatabaseUser
metadata:
  name: airbyte-service
  namespace: platform
spec:
  databases:
    - name: airbyte-db
      privileges: readwrite
    - name: temporal-db
      privileges: readwrite
    - name: temporal-visibility-db
      privileges: readonly
  privileges: readonly
  password:
    length: 24
---
apiVersion: dbtether.io/v1alpha1
kind: DatabaseUser
metadata:
  name: multi-db-service
  namespace: platform
spec:
  databases:
    - name: db1
    - name: db2
    - name: db3
  privileges: readwrite
  secretGeneration: perDatabase
  secret:
    template: POSTGRES
---
apiVersion: dbtether.io/v1alpha1
kind: DatabaseUser
metadata:
  name: shared-service
  namespace: team-alpha
spec:
  database:
    name: payments-db
  privileges: readwrite
  deletionPolicy: Retain
---
apiVersion: dbtether.io/v1alpha1
kind: DatabaseUser
metadata:
  name: api-user
  namespace: team-alpha
spec:
  database:
    name: orders-db
  privileges: readwrite
  secret:
    name: api-db-credentials
    template: DATABASE
---
apiVersion: dbtether.io/v1alpha1
kind: DatabaseUser
metadata:
  name: postgres-app
  namespace: team-alpha
spec:
  database:
    name: orders-db
  privileges: readwrite
  secret:
    template: POSTGRES
---
apiVersion: dbtether.io/v1alpha1
kind: DatabaseUser
metadata:
  name: legacy-connector
  namespace: team-alpha
spec:
  database:
    name: orders-db
  privileges: readonly
  secret:
    name: postgres-config
    template: custom
    keys:
      host: PGHOST
      port: PGPORT
      database: PGDATABASE
      username: PGUSER
      password: PGPASSWORD
---
apiVersion: dbtether.io/v1alpha1
kind: DatabaseUser
metadata:
  name: adopt-user
  namespace: team-alpha
spec:
  database:
    name: orders-db
  privileges: readwrite
  secret:
    name: orphaned-secret
    onConflict: Adopt
---
apiVersion: dbtether.io/v1alpha1
kind: DatabaseUser
metadata:
  name: merge-user
  namespace: team-alpha
spec:
  database:
    name: orders-db
  privileges: readwrite
  secret:
    name: app-config
    template: raw
    onConflict: Merge
---
apiVersion: dbtether.io/v1alpha1
kind: DatabaseUser
metadata:
  name: analytics-reader
  namespace: analytics
spec:
  database:
    name: main-db
    namespace: production
  privileges: readonly
