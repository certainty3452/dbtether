apiVersion: dbtether.io/v1alpha1
kind: Restore
metadata:
  name: restore-orders-latest
  namespace: default
spec:
  source:
    latestFrom:
      databaseRef:
        name: orders-db
  target:
    databaseRef:
      name: orders-db-restored
  onConflict: drop
---
apiVersion: dbtether.io/v1alpha1
kind: Restore
metadata:
  name: restore-orders-from-backup
  namespace: default
spec:
  source:
    backupRef:
      name: orders-backup-20260120-1400
  target:
    databaseRef:
      name: orders-db-restored
  onConflict: fail
---
apiVersion: dbtether.io/v1alpha1
kind: Restore
metadata:
  name: restore-orders-from-path
  namespace: default
spec:
  source:
    path: "microservices/orders_db/20260120-140000.sql.gz"
    storageRef:
      name: company-s3-backup
  target:
    databaseRef:
      name: orders-db-restored
  onConflict: drop
---
apiVersion: dbtether.io/v1alpha1
kind: Restore
metadata:
  name: restore-dev-from-prod
  namespace: dev
spec:
  source:
    latestFrom:
      databaseRef:
        name: prod-orders-db
      namespace: prod
  target:
    databaseRef:
      name: dev-database
  onConflict: drop
  ttlAfterCompletion: 1h
