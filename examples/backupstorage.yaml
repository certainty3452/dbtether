apiVersion: dbtether.io/v1alpha1
kind: BackupStorage
metadata:
  name: company-s3
spec:
  s3:
    bucket: my-company-backups
    region: eu-central-1
  credentialsSecretRef:
    name: s3-backup-credentials
    namespace: dbtether
---
# No credentialsSecretRef: uses IRSA/Pod Identity
apiVersion: dbtether.io/v1alpha1
kind: BackupStorage
metadata:
  name: company-s3-oidc
spec:
  s3:
    bucket: my-company-backups
    region: eu-central-1
  pathTemplate: "{{ .ClusterName }}/{{ .Year }}/{{ .Month }}"
---
# No credentialsSecretRef: uses Application Default Credentials (Workload Identity)
apiVersion: dbtether.io/v1alpha1
kind: BackupStorage
metadata:
  name: company-gcs
spec:
  gcs:
    bucket: my-company-backups
    project: my-gcp-project
  pathTemplate: "{{ .ClusterName }}/{{ .DatabaseName }}/{{ .Year }}"
---
# No credentialsSecretRef: uses DefaultAzureCredential (Managed Identity)
apiVersion: dbtether.io/v1alpha1
kind: BackupStorage
metadata:
  name: company-azure
spec:
  azure:
    container: pg-backups
    storageAccount: companybackupstorage
  pathTemplate: "{{ .ClusterName }}/{{ .DatabaseName }}"
---
apiVersion: dbtether.io/v1alpha1
kind: BackupStorage
metadata:
  name: minio-storage
spec:
  s3:
    bucket: backups
    region: us-east-1
    endpoint: https://minio.internal:9000
  credentialsSecretRef:
    name: minio-credentials
    namespace: dbtether
