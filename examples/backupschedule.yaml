apiVersion: dbtether.io/v1alpha1
kind: BackupSchedule
metadata:
  name: orders-nightly
  namespace: orders-team
spec:
  databaseRef:
    name: orders-db
  storageRef:
    name: company-s3
  schedule: "0 2 * * *"
  # Backups matching no keep* rule are deleted
  retention:
    keepLast: 7
    keepDaily: 30
    keepWeekly: 12
    keepMonthly: 12
  suspend: false
---
apiVersion: dbtether.io/v1alpha1
kind: BackupSchedule
metadata:
  name: test-hourly
  namespace: dev-team
spec:
  databaseRef:
    name: test-db
  storageRef:
    name: dev-s3
  schedule: "0 * * * *"
---
apiVersion: dbtether.io/v1alpha1
kind: BackupSchedule
metadata:
  name: analytics-weekly
  namespace: data-team
spec:
  databaseRef:
    name: analytics-db
  storageRef:
    name: company-s3
  schedule: "0 3 * * 0"
  retention:
    keepLast: 4
---
apiVersion: dbtether.io/v1alpha1
kind: BackupSchedule
metadata:
  name: large-db-nightly
  namespace: data-team
spec:
  databaseRef:
    name: large-analytics-db
  storageRef:
    name: company-s3
  schedule: "0 1 * * *"
  retention:
    keepLast: 7
    keepDaily: 14
  jobConfig:
    backoffLimit: 5
    activeDeadlineSeconds: 14400
    ttlSecondsAfterFailed: 86400
