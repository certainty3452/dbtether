---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: databaseusers.dbtether.io
spec:
  group: dbtether.io
  names:
    kind: DatabaseUser
    listKind: DatabaseUserList
    plural: databaseusers
    singular: databaseuser
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.clusterName
      name: Cluster
      type: string
    - jsonPath: .status.databasesSummary
      name: Databases
      type: string
    - jsonPath: .status.username
      name: Username
      type: string
    - jsonPath: .spec.privileges
      name: Privileges
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              additionalGrants:
                items:
                  properties:
                    privileges:
                      description: Enum here is the admission gate; controller re-checks
                        before SQL composition.
                      items:
                        enum:
                        - SELECT
                        - INSERT
                        - UPDATE
                        - DELETE
                        - TRUNCATE
                        - REFERENCES
                        - TRIGGER
                        - USAGE
                        type: string
                      minItems: 1
                      type: array
                    tables:
                      description: Pattern rules out null-bytes and unicode tricks
                        before SQL layer.
                      items:
                        maxLength: 63
                        pattern: ^[a-zA-Z_][a-zA-Z0-9_]*$
                        type: string
                      minItems: 1
                      type: array
                  required:
                  - privileges
                  - tables
                  type: object
                type: array
              connectionLimit:
                default: -1
                description: 0 is rejected because the int zero-value can't be distinguished
                  from "unset".
                minimum: -1
                type: integer
                x-kubernetes-validations:
                - message: connectionLimit 0 is not supported; use -1 for unlimited
                    or >= 1 to cap
                  rule: self == -1 || self >= 1
              database:
                description: |-
                  Simple case: single database reference
                  Mutually exclusive with Databases
                properties:
                  name:
                    description: Reference to Database resource
                    type: string
                  namespace:
                    type: string
                  privileges:
                    description: Override default privileges for this database
                    enum:
                    - readonly
                    - readwrite
                    - admin
                    - owner
                    type: string
                required:
                - name
                type: object
              databases:
                description: |-
                  Multiple databases: list of database references
                  Mutually exclusive with Database
                items:
                  description: DatabaseAccess defines access to a single database
                  properties:
                    name:
                      description: Reference to Database resource
                      type: string
                    namespace:
                      type: string
                    privileges:
                      description: Override default privileges for this database
                      enum:
                      - readonly
                      - readwrite
                      - admin
                      - owner
                      type: string
                  required:
                  - name
                  type: object
                minItems: 1
                type: array
              deletionPolicy:
                default: Delete
                enum:
                - Delete
                - Retain
                type: string
              idleInTransactionTimeout:
                description: |-
                  Aborts sessions idle inside a transaction longer than this. Unset clears the
                  role-level override. 0ms means "disabled" in PG — use unset to express that.
                type: string
                x-kubernetes-validations:
                - message: idleInTransactionTimeout must be at least 1ms
                  rule: duration(self) >= duration('1ms')
              password:
                properties:
                  length:
                    default: 16
                    maximum: 64
                    minimum: 12
                    type: integer
                type: object
              privileges:
                default: readonly
                description: Default privileges for all databases (can be overridden
                  per-database)
                enum:
                - readonly
                - readwrite
                - admin
                - owner
                type: string
              rotation:
                properties:
                  days:
                    maximum: 365
                    minimum: 1
                    type: integer
                required:
                - days
                type: object
              secret:
                properties:
                  keys:
                    properties:
                      database:
                        type: string
                      host:
                        type: string
                      password:
                        description: |-
                          Renaming after the secret exists forces a password regeneration — the
                          previous value can't be located under the old name. PG user keeps
                          working; consumers must re-read the secret.
                        type: string
                      port:
                        type: string
                      username:
                        type: string
                    type: object
                  name:
                    maxLength: 253
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                  onConflict:
                    default: Fail
                    description: |-
                      Merge mode persists via an annotation on the produced secret: once a
                      secret is adopted under Merge, subsequent reconciles keep overlaying
                      (foreign keys preserved) even if onConflict is later removed from the
                      spec. Use Adopt then Fail (or recreate the secret) to "fall back" to
                      full-replace semantics.
                    enum:
                    - Fail
                    - Adopt
                    - Merge
                    type: string
                  template:
                    default: raw
                    enum:
                    - raw
                    - DB
                    - DATABASE
                    - POSTGRES
                    - custom
                    - dsn
                    type: string
                type: object
              secretGeneration:
                default: primary
                description: |-
                  SecretGeneration controls how secrets are created for multiple databases
                  - primary (default): single secret with first database
                  - perDatabase: separate secret for each database (same password, different database field)
                enum:
                - primary
                - perDatabase
                type: string
              username:
                maxLength: 63
                pattern: ^[a-z_][a-z0-9_]*$
                type: string
            type: object
            x-kubernetes-validations:
            - message: spec.secret.name cannot be set when secretGeneration=perDatabase
                (each per-DB secret derives its name from the DB)
              rule: '!(self.secretGeneration == ''perDatabase'' && has(self.secret)
                && has(self.secret.name) && size(self.secret.name) > 0)'
            - message: onConflict policies Adopt/Merge are not supported when secretGeneration=perDatabase;
                only Fail is allowed
              rule: '!(self.secretGeneration == ''perDatabase'' && has(self.secret)
                && has(self.secret.onConflict) && self.secret.onConflict != ''Fail'')'
          status:
            properties:
              clusterName:
                description: ClusterName is the name of the DBCluster this user belongs
                  to
                type: string
              databases:
                description: Per-database access status
                items:
                  description: DatabaseAccessStatus represents the status of access
                    to a single database
                  properties:
                    databaseName:
                      description: DatabaseName is the actual PostgreSQL database
                        name
                      type: string
                    message:
                      description: Message contains additional information about the
                        status
                      type: string
                    name:
                      description: Name of the Database resource
                      type: string
                    namespace:
                      description: Namespace of the Database resource (empty if same
                        as user)
                      type: string
                    phase:
                      description: Phase indicates the status of access to this database
                      enum:
                      - Pending
                      - Ready
                      - Failed
                      type: string
                    privileges:
                      description: Privileges granted on this database
                      type: string
                    secretName:
                      description: SecretName for this database (only set when secretGeneration=perDatabase)
                      type: string
                  required:
                  - name
                  type: object
                type: array
              databasesSummary:
                description: DatabasesSummary for printer column display (e.g., "db1
                  (+2)")
                type: string
              message:
                type: string
              observedGeneration:
                format: int64
                type: integer
              passwordUpdatedAt:
                format: date-time
                type: string
              pendingSince:
                format: date-time
                type: string
              phase:
                enum:
                - Pending
                - Creating
                - Ready
                - Failed
                type: string
              secretName:
                description: Primary secret name (for first database or single secret
                  mode)
                type: string
              username:
                description: Username is the PostgreSQL username
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
