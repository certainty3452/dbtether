name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

env:
  GO_VERSION: '1.26'

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install dependencies
        run: go mod download

      - name: Setup envtest
        run: echo "KUBEBUILDER_ASSETS=$(make -s envtest-path)" >> "$GITHUB_ENV"

      - name: Read golangci-lint version
        id: golangci
        run: echo "version=$(make -s print-GOLANGCI_LINT_VERSION)" >> "$GITHUB_OUTPUT"

      - name: Run linter
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ steps.golangci.outputs.version }}

      - name: Run tests with envtest
        run: go test ./... -tags=envtest -race -coverprofile=coverage.out -covermode=atomic

      - name: Install PostgreSQL clients
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-16 postgresql-client-18

      - name: Run PostgreSQL integration tests
        env:
          DBTETHER_TEST_DSN: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
          DBTETHER_TEST_PG_CLIENT_DIRS: 16=/usr/lib/postgresql/16/bin,18=/usr/lib/postgresql/18/bin
        run: PATH=/usr/lib/postgresql/16/bin:$PATH go test ./pkg/postgres/ ./pkg/backup/ ./controllers/ -tags=integration -count=1 -v

      - name: Run PostgreSQL integration tests against an older server
        env:
          DBTETHER_TEST_DSN: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
          DBTETHER_TEST_PG_CLIENT_DIRS: 16=/usr/lib/postgresql/16/bin,18=/usr/lib/postgresql/18/bin
        run: PATH=/usr/lib/postgresql/18/bin:$PATH go test ./pkg/backup/ -tags=integration -count=1 -v

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.out
          fail_ci_if_error: false

  build:
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build
        run: go build -o bin/manager main.go

      - name: Verify generated files are up to date
        run: |
          make generate manifests
          git diff --exit-code charts/dbtether/crds api/v1alpha1/zz_generated.deepcopy.go
          test -z "$(git status --porcelain -- charts/dbtether/crds api/v1alpha1/zz_generated.deepcopy.go)"

  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t dbtether:ci .

      - name: Verify the bundled PostgreSQL clients
        run: |
          docker run --rm --entrypoint sh dbtether:ci -c 'set -e; for v in 16 17 18; do /usr/libexec/postgresql$v/pg_dump --version; /usr/libexec/postgresql$v/psql --version; done'

  chart:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Lint Helm chart
        run: |
          helm lint charts/dbtether

  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Run Trivy vulnerability scanner (filesystem)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true

      - name: Run Trivy vulnerability scanner (config)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'config'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

