name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GO_VERSION: '1.25'

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install dependencies
        run: go mod download

      - name: Setup envtest
        run: |
          go install sigs.k8s.io/controller-runtime/tools/setup-envtest@latest
          setup-envtest use 1.31.0 --bin-dir ./bin

      - name: Run linter
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest

      - name: Run tests with envtest
        run: |
          export KUBEBUILDER_ASSETS=$(setup-envtest use 1.31.0 -p path)
          go test ./... -tags=envtest -race -coverprofile=coverage.out -covermode=atomic

      - name: Install PostgreSQL clients
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-16 postgresql-client-18

      - name: Run PostgreSQL integration tests
        env:
          DBTETHER_TEST_DSN: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
          DBTETHER_TEST_PG_CLIENT_DIRS: 16=/usr/lib/postgresql/16/bin,18=/usr/lib/postgresql/18/bin
        run: PATH=/usr/lib/postgresql/16/bin:$PATH go test ./pkg/postgres/ ./pkg/backup/ -tags=integration -count=1 -v

      - name: Run PostgreSQL integration tests against an older server
        env:
          DBTETHER_TEST_DSN: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
          DBTETHER_TEST_PG_CLIENT_DIRS: 16=/usr/lib/postgresql/16/bin,18=/usr/lib/postgresql/18/bin
        run: PATH=/usr/lib/postgresql/18/bin:$PATH go test ./pkg/backup/ -tags=integration -count=1 -v

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.out
          fail_ci_if_error: false

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build
        run: go build -o bin/manager main.go

      - name: Verify CRDs are up to date
        run: |
          go run sigs.k8s.io/controller-tools/cmd/controller-gen@v0.20.1 object:headerFile="hack/boilerplate.go.txt" paths="./..."
          go run sigs.k8s.io/controller-tools/cmd/controller-gen@v0.20.1 rbac:roleName=manager-role crd paths="./..." output:crd:artifacts:config=config/crd/bases
          git diff --exit-code config/crd/bases/ config/rbac/role.yaml api/v1alpha1/zz_generated.deepcopy.go

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t dbtether:ci .

      - name: Verify the bundled PostgreSQL clients
        run: |
          docker run --rm --entrypoint sh dbtether:ci -c 'set -e; for v in 16 17 18; do /usr/libexec/postgresql$v/pg_dump --version; /usr/libexec/postgresql$v/psql --version; done'

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify image.tag matches appVersion
        run: |
          APP_VERSION=$(grep '^appVersion:' charts/dbtether/Chart.yaml | sed 's/appVersion: *"\(.*\)"/\1/')
          IMAGE_TAG=$(grep '^\s*tag:' charts/dbtether/values.yaml | sed 's/.*tag: *"\(.*\)"/\1/')
          # Anchor on the values-table row to avoid breakage if `image.tag`
          # is mentioned again elsewhere in the README. The row is:
          # | `image.tag` | Image tag | `0.6.2` |
          README_TAG=$(grep -E '^\| `image\.tag` \|' charts/dbtether/README.md | awk -F'`' '{print $4}')
          if [ -z "$README_TAG" ]; then
            echo "ERROR: could not extract image.tag from charts/dbtether/README.md (values table row missing or malformed)"
            exit 1
          fi

          echo "Chart appVersion: $APP_VERSION"
          echo "Image tag:       $IMAGE_TAG"
          echo "README image.tag: $README_TAG"

          if [ "$APP_VERSION" != "$IMAGE_TAG" ]; then
            echo "ERROR: image.tag ($IMAGE_TAG) does not match appVersion ($APP_VERSION)"
            echo "Please update charts/dbtether/values.yaml to match Chart.yaml appVersion"
            exit 1
          fi
          if [ "$APP_VERSION" != "$README_TAG" ]; then
            echo "ERROR: README.md image.tag ($README_TAG) does not match appVersion ($APP_VERSION)"
            echo "Please update charts/dbtether/README.md values table"
            exit 1
          fi
          echo "✓ Versions match"

      - name: Verify chart CRDs match generated CRDs
        run: |
          echo "Comparing config/crd/bases/ with charts/dbtether/crds/"
          if ! diff -q config/crd/bases/ charts/dbtether/crds/ > /dev/null 2>&1; then
            echo "ERROR: Chart CRDs are out of sync with generated CRDs"
            echo "Please copy CRDs: cp config/crd/bases/*.yaml charts/dbtether/crds/"
            diff config/crd/bases/ charts/dbtether/crds/
            exit 1
          fi
          echo "✓ CRDs are in sync"

      - name: Lint Helm chart
        run: |
          helm lint charts/dbtether

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner (filesystem)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'  # Fail on CRITICAL/HIGH
          ignore-unfixed: true

      - name: Run Trivy vulnerability scanner (config)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'  # Don't fail on misconfigs, just report

